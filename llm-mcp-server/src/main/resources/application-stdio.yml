# ┌────────────────────────────────────────────────────────────┐
# │ Stdio 模式 —— 通过标准输入输出与客户端通信                   │
# │                                                           │
# │ 使用场景：本地轻量化工具，无需网络，适合 Cline 等桌面客户端    │
# │                                                           │
# │ 核心要求：控制台输出必须完全是 JSON（JSON-RPC），              │
# │           不能有任何日志、banner 等多余字符！                 │
# │           否则客户端解析 stdout 就会报错                     │
# └────────────────────────────────────────────────────────────┘

