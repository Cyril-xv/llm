<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDD Auto Refund - 智能客服</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card: #ffffff;
            --primary: #e53e3e;
            --primary-hover: #c53030;
            --text: #1a202c;
            --text-secondary: #718096;
            --border: #e2e8f0;
            --user-bubble: #e53e3e;
            --ai-bubble: #edf2f7;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 720px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--card);
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        /* Header */
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        header .order-info {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .btn-new {
            font-size: 13px;
            padding: 6px 16px;
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-new:hover { background: var(--primary); color: white; }

        /* New Chat Panel */
        .new-chat-overlay {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 20px;
        }
        .new-chat-overlay.hidden { display: none; }
        .new-chat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .new-chat-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .new-chat-card p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .new-chat-card label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
            margin-top: 12px;
        }
        .new-chat-card input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .new-chat-card input:focus { border-color: var(--primary); }
        .new-chat-card button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .new-chat-card button:hover { background: var(--primary-hover); }
        .new-chat-card button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Struct output */
        .struct-output {
            width: 100%;
            max-width: 400px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: var(--radius);
            padding: 16px;
            font-size: 13px;
        }
        .struct-output h3 { font-size: 14px; margin-bottom: 8px; color: var(--primary); }
        .struct-output .field { display: flex; justify-content: space-between; padding: 4px 0; color: var(--text); }
        .struct-output .field span:first-child { color: var(--text-secondary); }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-area.hidden { display: none; }

        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .message .role-label {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.6;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .message.user .role-label { color: rgba(255,255,255,0.7); }
        .message.ai .role-label { color: var(--text-secondary); }

        .message.tool-call {
            align-self: center;
            background: #fffaf0;
            border: 1px dashed #f6ad55;
            color: #c05621;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 8px;
            max-width: 90%;
            text-align: center;
        }

        .typing-indicator {
            align-self: flex-start;
            display: flex;
            gap: 4px;
            padding: 10px 16px;
            background: var(--ai-bubble);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }
        .typing-indicator span {
            width: 6px; height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* Input Area */
        .input-area {
            padding: 12px 24px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .input-area.hidden { display: none; }
        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: var(--primary); }
        .input-area button {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .input-area button:hover { background: var(--primary-hover); }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        .error-msg {
            align-self: center;
            color: #e53e3e;
            font-size: 13px;
            padding: 8px 16px;
            background: #fff5f5;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>PDD 智能客服</h1>
        <span class="order-info" id="orderDisplay"></span>
        <button class="btn-new" onclick="resetChat()" id="btnReset" style="display:none">新对话</button>
    </header>

    <!-- New Chat Panel -->
    <div class="new-chat-overlay" id="newChatPanel">
        <div class="new-chat-card">
            <h2>开始咨询</h2>
            <p>请输入您的用户ID和订单号</p>
            <label for="userId">用户 ID</label>
            <input type="text" id="userId" placeholder="例如: user_001" value="user_001">
            <label for="orderId">订单号</label>
            <input type="text" id="orderId" placeholder="例如: 20240520001" value="20240520001">
            <button onclick="startNewChat()" id="btnStart">开始对话</button>
        </div>
        <div id="structOutput"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area hidden" id="chatArea"></div>

    <!-- Input Area -->
    <div class="input-area hidden" id="inputArea">
        <input type="text" id="questionInput" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()" id="btnSend">&#10148;</button>
    </div>
</div>

<script>
    let currentChatId = null;
    let currentOrderId = null;
    let currentUserId = null;
    let isStreaming = false;

    const chatArea = document.getElementById('chatArea');
    const newChatPanel = document.getElementById('newChatPanel');
    const inputArea = document.getElementById('inputArea');
    const structOutput = document.getElementById('structOutput');
    const orderDisplay = document.getElementById('orderDisplay');
    const btnReset = document.getElementById('btnReset');
    const btnStart = document.getElementById('btnStart');
    const btnSend = document.getElementById('btnSend');
    const questionInput = document.getElementById('questionInput');

    async function startNewChat() {
        const userId = document.getElementById('userId').value.trim();
        const orderId = document.getElementById('orderId').value.trim();
        if (!userId || !orderId) { alert('请填写用户ID和订单号'); return; }

        btnStart.disabled = true;
        btnStart.textContent = '初始化中...';

        try {
            const resp = await fetch(`/newChat?userId=${encodeURIComponent(userId)}&orderId=${encodeURIComponent(orderId)}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            currentChatId = data.chatId;
            currentOrderId = data.orderId;
            currentUserId = data.userId;

            // Display structured output
            structOutput.innerHTML = `
                <div class="struct-output">
                    <h3>对话已创建</h3>
                    <div class="field"><span>订单号</span><span>${data.orderId}</span></div>
                    <div class="field"><span>用户ID</span><span>${data.userId}</span></div>
                    <div class="field"><span>对话ID</span><span style="font-size:11px">${data.chatId}</span></div>
                    <div class="field"><span>状态</span><span>${data.status}</span></div>
                </div>`;

            // Switch to chat mode
            newChatPanel.classList.add('hidden');
            chatArea.classList.remove('hidden');
            inputArea.classList.remove('hidden');
            btnReset.style.display = 'block';
            orderDisplay.textContent = `订单: ${orderId}`;
            chatArea.innerHTML = '';
        } catch (e) {
            alert('初始化失败: ' + e.message);
        } finally {
            btnStart.disabled = false;
            btnStart.textContent = '开始对话';
        }
    }

    function resetChat() {
        currentChatId = null;
        currentOrderId = null;
        currentUserId = null;
        chatArea.innerHTML = '';
        chatArea.classList.add('hidden');
        inputArea.classList.add('hidden');
        newChatPanel.classList.remove('hidden');
        btnReset.style.display = 'none';
        orderDisplay.textContent = '';
        structOutput.innerHTML = '';
    }

    function addMessage(role, text, cssClass = '') {
        const div = document.createElement('div');
        div.className = `message ${role} ${cssClass}`;
        if (role !== 'tool-call') {
            div.innerHTML = `<div class="role-label">${role === 'user' ? '您' : '客服'}</div>`;
        }
        const content = document.createElement('span');
        content.className = 'msg-content';
        div.appendChild(content);
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return content;
    }

    function addToolCallMessage(text) {
        const div = document.createElement('div');
        div.className = 'message tool-call';
        div.textContent = 'TOOL: ' + text;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'typing-indicator';
        div.id = 'typingIndicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function sendMessage() {
        if (isStreaming) return;
        const question = questionInput.value.trim();
        if (!question || !currentChatId) return;

        isStreaming = true;
        btnSend.disabled = true;
        questionInput.value = '';
        questionInput.disabled = true;

        addMessage('user', question);
        showTyping();

        try {
            const url = `/ask?question=${encodeURIComponent(question)}&chatId=${encodeURIComponent(currentChatId)}`;
            const resp = await fetch(url, { headers: { Accept: 'text/event-stream' } });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            removeTyping();
            const aiContent = addMessage('ai', '');

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                // Parse SSE events
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        let chunk = line.substring(5).trim();
                        if (!chunk) continue;

                        // Handle JSON-formatted SSE data
                        try {
                            const json = JSON.parse(chunk);
                            if (json.result && json.result.metadata) {
                                // tool call metadata
                                if (json.result.metadata.finishReason === 'tool_calls') {
                                    addToolCallMessage('正在处理退款...');
                                }
                            }
                            if (json.message && json.message.content) {
                                chunk = json.message.content;
                            } else if (json.content) {
                                chunk = json.content;
                            } else if (json.text) {
                                chunk = json.text;
                            } else {
                                chunk = typeof json === 'string' ? json : JSON.stringify(json);
                            }
                        } catch (e) {
                            // plain text chunk, use as-is
                        }

                        if (chunk) {
                            aiContent.textContent += chunk;
                            chatArea.scrollTop = chatArea.scrollHeight;
                        }
                    }
                }
            }
        } catch (e) {
            removeTyping();
            const err = document.createElement('div');
            err.className = 'error-msg';
            err.textContent = '请求失败: ' + e.message;
            chatArea.appendChild(err);
        } finally {
            isStreaming = false;
            btnSend.disabled = false;
            questionInput.disabled = false;
            questionInput.focus();
        }
    }
</script>
</body>
</html>
